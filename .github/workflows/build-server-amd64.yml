name: CI - Build server - amd64

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  server:
    name: Build server amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Verify Go toolchain
        run: |
          which go
          go version

      - name: Build server release
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go env -w GO111MODULE=on
          go version
          go build -v -o playsheet-server

      - name: Package server binary
        run: |
          mkdir -p release_dist
          mkdir -p release_dist/playsheet-server
          echo "Listing server build directories for diagnostics"
          ls -la server || true
          cp LICENSE release_dist/playsheet-server/LICENSE || true
          cp THIRD_PARTY_LICENSES.md release_dist/playsheet-server/THIRD_PARTY_LICENSES.md || true
          cp server/README.md release_dist/playsheet-server/README.md || true
          cp server/playsheet-server release_dist/playsheet-server/playsheet-server || true
          cp server/deploy/install.sh release_dist/playsheet-server/install.sh || true
          cp server/deploy/uninstall.sh release_dist/playsheet-server/uninstall.sh || true
          cp server/etc/config.json.example release_dist/playsheet-server/config.json.example || true
          cp server/systemd/playsheet-server.service release_dist/playsheet-server/playsheet-server.service || true
          chmod +x release_dist/playsheet-server/install.sh || true
          chmod +x release_dist/playsheet-server/uninstall.sh || true
          cd release_dist && zip -r playsheet-server-amd64.zip playsheet-server

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: playsheet-server
          path: release_dist/playsheet-server-amd64.zip

      - name: Upload server artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: release_dist/playsheet-server-amd64.zip
          asset_name: playsheet-server-amd64.zip
          asset_content_type: application/zip
